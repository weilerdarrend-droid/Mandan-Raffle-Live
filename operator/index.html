<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mandan Baseball — Winner Sync Test</title><style>*{box-sizing:border-box}body{margin:0;background:#07170e;color:#fff;font:16px system-ui,Arial}.wrap{max-width:620px;margin:30px auto;padding:20px}.card{border:1px solid #b88c32;background:#123522;border-radius:16px;padding:24px}h1{margin:0 0 8px;color:#e9bd54}p{color:#bed2c3}label{display:block;margin:15px 0 6px;color:#e9bd54;font-weight:700}input{width:100%;padding:13px;background:#06140c;color:white;border:1px solid #65826a;border-radius:8px;font-size:16px}button{background:#dfb64d;color:#07170e;border:0;border-radius:8px;padding:13px 18px;font-weight:900;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}#status{margin-top:16px;white-space:pre-wrap}a{color:#e9bd54}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><h1>MANDAN BASEBALL</h1><strong>Winner Live Sync — Operator Test</strong><p>Test page only. Does not change the production raffle program. Sign in with an authorized Supabase account to publish a test winner.</p><section id="login"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">Sign In</button></section><section id="controls" class="hidden"><p id="signedIn"></p><label>Gun Number</label><input id="gun" type="number" min="1" max="30" value="12"><label>Prize</label><input id="prize" value="Browning X-Bolt"><label>Caliber</label><input id="caliber" value="6.5 Creedmoor"><label>Winner Name</label><input id="winner" value="Jordan Smith"><label>Ticket Number</label><input id="ticket" value="184627"><button id="reveal">REVEAL WINNER</button> <button id="signOut" type="button">Sign Out</button></section><div id="status" role="status"></div><p><a href="https://weilerdarrend-droid.github.io/Mandan-Raffle-Live/" target="_blank" rel="noopener">Open Fan Live View</a></p></div></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.8';
const db=createClient('https://thfgexrbckzabsyzshro.supabase.co','sb_publishable_WRIjhgSGtQAUM3t3-cSLvg_4i_xJ3pl');
const $=id=>document.getElementById(id), status=s=>$('status').textContent=s;
function show(session){$('login').classList.toggle('hidden',!!session);$('controls').classList.toggle('hidden',!session);$('signedIn').textContent=session?'Signed in: '+session.user.email:'';}
const {data:{session}}=await db.auth.getSession();show(session);
db.auth.onAuthStateChange((_event,s)=>show(s));
$('signIn').onclick=async()=>{status('Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});status(error?'Sign-in error: '+error.message:'Signed in. Ready for test.');};
$('signOut').onclick=async()=>{await db.auth.signOut();status('Signed out');};
$('reveal').onclick=async()=>{const name=$('winner').value.trim(),ticket=$('ticket').value.trim(),gun=Number($('gun').value);if(!name||!ticket||!Number.isInteger(gun)||gun<1||gun>30){status('Enter a winner, ticket number and valid gun number.');return;} $('reveal').disabled=true;status('Publishing winner…');const {data,error}=await db.from('raffle_live_state').update({mode:'winner',gun_number:gun,prize_name:$('prize').value.trim(),caliber:$('caliber').value.trim(),winner_name:name,ticket_number:ticket,updated_at:new Date().toISOString()}).eq('event_key','mandan-baseball-main').select('event_key,winner_name,ticket_number').single();status(error?'Publish failed: '+error.message:data?'Published '+data.winner_name+' — ticket #'+data.ticket_number+'. Check iPhone.':'No record updated.');$('reveal').disabled=false;};
</script></body></html>
